<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Mouneh w Khabrieh</title>
  <meta name="description" content="Your cart at Mouneh w Khabrieh. Review selected premium Lebanese products, update quantities, and proceed to checkout." />
  <link rel="canonical" href="https://mounehwkhabrieh.com/cart.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cart | Mouneh w Khabrieh" />
  <meta property="og:description" content="Review selected premium Lebanese products, update quantities, and prepare for checkout." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/shop.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="homepage-body">
  <div id="site-header"></div>
  <main class="page-shell cart-page">
    <section class="cart-hero">
      <div>
        <span>Your cart</span>
        <h1>Your pantry,<br class="cart-title-break" /> ready when you are.</h1>
        <p>Adjust quantities, save favorites for later and prepare your order with confidence.</p>
      </div>
    </section>

    <section class="cart-layout">
      <div class="cart-items" id="cartItems"></div>
      <aside class="cart-summary">
        <div class="summary-panel">
          <h2>Order summary</h2>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="cartSubtotal">$0.00</span>
          </div>
          <div class="summary-row muted">
            <span>Estimated delivery</span>
            <span>Calculated at checkout</span>
          </div>
          <div class="summary-row summary-total">
            <strong>Estimated total</strong>
            <strong id="cartEstimatedTotal">$0.00</strong>
          </div>
          <div class="coupon-group">
            <label for="couponCode">Coupon code</label>
            <input id="couponCode" type="text" placeholder="Enter code" />
            <button class="button button-secondary" type="button" id="applyCoupon">Apply</button>
          </div>
          <button class="button button-primary full-width" type="button" id="checkoutButton">Proceed to Checkout</button>
          <p class="checkout-note">Your selections are saved so you can return anytime.</p>
        </div>
      </aside>
    </section>
  </main>
  <div class="cart-sticky-checkout" id="cartStickyCheckout" hidden>
    <div><span>Total</span><strong id="cartStickyTotal">$0.00</strong></div>
    <button class="button button-primary" id="stickyCheckoutButton" type="button">Checkout</button>
  </div>
  <div id="site-footer"></div>
  <div id="site-overlays"></div>
  <script src="data/products.js"></script>
  <script src="data/categories.js"></script>
  <script src="js/global.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
