<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Mouneh w Khabrieh</title>
  <meta name="description" content="Complete your Mouneh w Khabrieh pantry order." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/checkout.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="homepage-body">
  <div id="site-header"></div>
  <main class="page-shell checkout-page">
    <header class="checkout-hero">
      <span>Secure checkout</span>
      <h1>Complete your pantry order.</h1>
      <p>Your cart is preserved while you review delivery details and order totals.</p>
    </header>

    <div class="checkout-layout">
      <form class="checkout-details" id="checkoutDetailsForm">
        <h2>Delivery details</h2>
        <div class="checkout-fields">
          <label>First name<input name="firstName" autocomplete="given-name" required /></label>
          <label>Last name<input name="lastName" autocomplete="family-name" required /></label>
          <label class="checkout-field-wide">Email<input name="email" type="email" autocomplete="email" required /></label>
          <label class="checkout-field-wide">Phone<input name="phone" type="tel" autocomplete="tel" required /></label>
          <label class="checkout-field-wide">Address<input name="address" autocomplete="street-address" required /></label>
          <label>City<input name="city" autocomplete="address-level2" required /></label>
          <label>Country<input name="country" autocomplete="country-name" required /></label>
        </div>
        <button class="button button-primary checkout-continue" type="submit">Save delivery details</button>
      </form>

      <aside class="checkout-summary" aria-labelledby="checkoutSummaryTitle">
        <h2 id="checkoutSummaryTitle">Order summary</h2>
        <div class="checkout-items" id="checkoutItems"></div>
        <div class="checkout-summary-row"><span>Subtotal</span><span id="checkoutSubtotal">$0.00</span></div>
        <div class="checkout-summary-row"><span>Estimated delivery</span><span>Calculated after address</span></div>
        <div class="checkout-summary-row checkout-summary-total"><strong>Estimated total</strong><strong id="checkoutTotal">$0.00</strong></div>
        <p class="checkout-coupon" id="checkoutCoupon" hidden></p>
        <a class="checkout-back" href="cart.html">← Return to cart</a>
      </aside>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="site-overlays"></div>
  <script src="data/products.js"></script>
  <script src="data/categories.js"></script>
  <script src="js/global.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
